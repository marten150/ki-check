:root{--uniblau:#005F9B;--dunkel:#3B3B3A;--text:#575756;--grau:#7F7F7F;--haar:#DDE1E5;--feld:#9AA5B1;--fehler:#A4262C}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--text);font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.4}
.site::after{content:"";display:block;height:3px;background:linear-gradient(90deg,#153268 0%,#005F9B 55%,#0091C8 100%)}
.site-innen{max-width:1560px;margin:0 auto;padding:.85rem 3vw .75rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{display:block;flex:none;line-height:0}
.logo svg{display:block;height:auto}
.logo.goe svg{width:clamp(150px,15.5vw,252px)}
.logo.rwth svg{width:clamp(92px,9.3vw,152px)}
main{max-width:44rem;margin:0 auto;padding:clamp(3rem,14vh,9rem) 16px 3rem}
form{max-width:26rem}
h1{margin:0 0 1.8rem;color:var(--uniblau);font-weight:400;font-size:clamp(2rem,5vw,2.9rem);line-height:1.1}
label{display:block}
.feld{font-weight:700;color:var(--dunkel);margin-bottom:.35rem}
input[type=password]{display:block;width:100%;font:inherit;font-size:1.1rem;color:var(--dunkel);padding:.5rem .6rem;border:1px solid var(--feld);border-radius:2px;background:#fff}
input[type=password]:focus{outline:2px solid var(--uniblau);outline-offset:1px;border-color:var(--uniblau)}
.merken{display:flex;align-items:center;gap:.5rem;margin:.9rem 0 1.3rem;color:var(--text);cursor:pointer}
.merken input{width:1.05rem;height:1.05rem;margin:0;accent-color:var(--uniblau)}
button{font:inherit;font-weight:700;color:#fff;background:var(--uniblau);border:0;border-radius:2px;padding:.55rem 1.4rem;cursor:pointer}
button:hover{background:#153268}
button:focus-visible{outline:2px solid var(--uniblau);outline-offset:2px}
button:disabled{background:var(--grau);cursor:wait}
#kc-meldung{min-height:1.4em;margin:1rem 0 0;color:var(--fehler)}
.kc-laedt main{visibility:hidden}
@media (max-width:520px){.site-innen{padding:.7rem 16px .55rem}}
</style>
